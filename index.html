<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Golf Sport · 选择角色</title>
  <style>
    :root { --bg-top: #2f8fd6; --bg-bottom: #bfe8a8; --accent: #e5484d; --ink: #10243a; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--ink); background: linear-gradient(180deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, 0) 40%, rgba(20, 50, 40, .25)), url(/ui/bg_select.webp) center / cover, linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      user-select: none; -webkit-user-select: none;
    }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    header { position: fixed; top: max(18px, env(safe-area-inset-top)); left: 24px; color: #fff; text-shadow: 0 2px 10px rgba(0, 40, 80, .35); pointer-events: none; }
    header { display: flex; align-items: baseline; gap: 14px; padding: 10px 26px 9px; border-radius: 99px; background: #145a37; border-bottom: 2px solid #c9a35a; color: #fff; text-shadow: none; box-shadow: 0 4px 12px rgba(20, 60, 30, .25); font-family: "Didot", "Bodoni 72", "Songti SC", "STSong", Georgia, serif; }
    header h1 { font-size: 24px; font-weight: 600; letter-spacing: 3px; }
    header p { font-size: 11px; letter-spacing: 4px; opacity: .9; }

    #info { position: fixed; right: 28px; top: 50%; transform: translateY(-56%); width: 330px; padding: 20px 22px 22px; border-radius: 20px; }
    #info .type { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #fff; background: #1f7a4d; padding: 4px 12px; border-radius: 99px; }
    #info .name { display: flex; align-items: baseline; gap: 10px; margin-top: 10px; font-family: "Didot", "Bodoni 72", "Songti SC", "STSong", Georgia, serif; }
    #info .name b { font-size: 38px; font-weight: 600; line-height: 1.1; color: #26343c; }
    #info .name span { font-size: 17px; font-style: italic; letter-spacing: 3px; color: #c9a35a; }
    #info .desc { font-size: 13px; line-height: 1.6; margin: 6px 0 14px; color: #6b7b85; }
    .stat { display: grid; grid-template-columns: 92px 1fr 22px; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; font-weight: 700; color: #26343c; }
    .stat small { display: block; font-size: 10px; letter-spacing: 1px; color: #6b7b85; font-weight: 600; }
    .stat .bar { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; height: 9px; }
    .stat .bar i { display: block; border-radius: 2px; background: #e3e9e6; transition: background .25s; }
    .stat .bar i:first-child { border-radius: 5px 2px 2px 5px; } .stat .bar i:last-child { border-radius: 2px 5px 5px 2px; }
    .stat .bar i.on { background: #1f7a4d; }
    .stat .num { text-align: right; color: #1f7a4d; font-size: 15px; }
    #modelState { display: none; }
    #confirmBtn { display: block; width: 100%; margin: 18px 0 0; }
    body[data-mode="game"] :is(#stage, header, #info, #roster, #devBtn) { display: none; }

    #roster { position: fixed; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 12px; padding: 0 16px; }
    .card { position: relative; width: 104px; height: 132px; flex: none; padding: 0; border: 0; border-radius: 16px; overflow: hidden; cursor: pointer; background: #e6e6e6 var(--face) center 5% / 215% no-repeat; box-shadow: 0 0 0 3px rgba(251, 248, 239, .95), 0 6px 14px rgba(20, 40, 30, .25); transition: transform .18s, box-shadow .18s; font: inherit; color: #26343c; }
    .card:hover { transform: translateY(-4px); }
    .card.on { transform: translateY(-12px) scale(1.06); box-shadow: 0 0 0 3px #1f7a4d, 0 0 0 5px #c9a35a, 0 12px 22px rgba(20, 40, 30, .3); z-index: 1; }
    .card .tag { position: absolute; left: 0; right: 0; bottom: 0; padding: 5px 4px 6px; text-align: center; background: rgba(251, 248, 239, .95); }
    .card.on .tag { background: #145a37; color: #fff; }
    .card .tag b { display: block; font-size: 14px; font-weight: 700; }
    .card .tag span { font-size: 9px; letter-spacing: 2px; color: #c9a35a; }

    #devBtn { position: fixed; right: 12px; bottom: 12px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: rgba(16, 36, 58, .35); color: #fff; font-size: 17px; cursor: pointer; opacity: .45; z-index: 40; }
    #devBtn:hover { opacity: 1; }
    #devExport { position: fixed; left: 16px; bottom: 16px; width: min(440px, calc(100vw - 32px)); z-index: 60; background: #14202e; color: #dfe9f3; border-radius: 12px; overflow: hidden; box-shadow: 0 16px 40px rgba(0, 0, 0, .4); }
    .dev-export-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; font-size: 12px; }
    .dev-export-head button { background: none; border: 0; color: inherit; font-size: 14px; cursor: pointer; }
    #devExport textarea { display: block; width: 100%; height: 240px; border: 0; padding: 10px 12px; background: #0c151f; color: #9be29b; font: 11px/1.45 ui-monospace, Menlo, monospace; resize: vertical; user-select: text; -webkit-user-select: text; }

    /* 手機／直向版面 */
    @media (max-width: 767px), (orientation: portrait) {
      header { left: 16px; }
      /* 手機：背景只鋪上半部，讓木地板剛好落在人物腳下，下方接地板色 */
      body { background: url(/ui/bg_select.webp) center top / auto 55% no-repeat, linear-gradient(#b9895f, #a87850); }
      header { left: 12px; padding: 7px 18px 6px; } header h1 { font-size: 18px; } header p { display: none; }
      #info { left: 10px; right: 10px; top: auto; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 124px); transform: none; width: auto; padding: 12px 14px 14px; }
      #info .name b { font-size: 26px; }
      #info .name span { font-size: 14px; }
      #info .desc { font-size: 12px; margin: 4px 0 6px; }
      #stats { display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; }
      .stat { grid-template-columns: 62px 1fr 18px; gap: 6px; margin-top: 6px; font-size: 12px; }
      .stat small { font-size: 9px; }
      #modelState { display: none; }
      #confirmBtn { margin-top: 10px; font-size: 16px; padding: .45em 1em .4em; }
      #roster { justify-content: flex-start; gap: 8px; overflow-x: auto; padding: 12px 12px 0; bottom: max(14px, env(safe-area-inset-bottom)); scrollbar-width: none; }
      #roster::-webkit-scrollbar { display: none; }
      .card { width: 76px; height: 98px; }
      .card.on { transform: translateY(-8px) scale(1.05); }
      .card .tag b { font-size: 13px; }
      .card .tag span { font-size: 9px; }
      #devBtn { top: max(14px, env(safe-area-inset-top)); bottom: auto; }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <header>
    <h1>选择角色</h1>
    <p>SELECT YOUR GOLFER</p>
  </header>
  <aside id="info" class="u-card">
    <span class="type" id="cType"></span>
    <div class="name"><b id="cZh"></b><span id="cEn"></span></div>
    <p class="desc" id="cDesc"></p>
    <div id="stats"></div>
    <div id="modelState"></div>
    <button id="confirmBtn" class="u-btn" type="button">确认出战<small>CONFIRM</small></button>
  </aside>
  <nav id="roster"></nav>
  <button id="devBtn" title="DEV (D)">⚙</button>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
